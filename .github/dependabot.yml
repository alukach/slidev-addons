# Weekly dependency updates, grouped into one PR per ecosystem. Titles are
# Conventional Commits (chore/ci), so they pass the PR title check and don't
# trigger a package release by themselves.
version: 2
updates:
  - package-ecosystem: npm   # covers pnpm, including the catalog in pnpm-workspace.yaml
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
