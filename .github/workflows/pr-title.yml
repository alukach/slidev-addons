name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main, and
# release-please reads it to decide versions. It must be a Conventional Commit:
# https://www.conventionalcommits.org (see CONTRIBUTING.md → Commits).
on:
  # pull_request_target so it also works for PRs from forks. Safe here: it only
  # reads the PR title and never checks out the PR's code.
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
