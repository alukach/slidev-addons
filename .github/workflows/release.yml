name: Release

# release-please reads Conventional Commits on main and keeps one release PR
# open per package with pending changes. Merging a release PR tags it and
# creates the GitHub release; the publish step then pushes it to npm.
on:
  push:
    branches: [main]

permissions:
  contents: write       # tags, GitHub releases
  pull-requests: write  # release PRs
  id-token: write       # npm trusted publishing (OIDC) + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

      - if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@v7
      - if: steps.release.outputs.releases_created == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.release.outputs.releases_created == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - if: steps.release.outputs.releases_created == 'true'
        run: npm install -g npm@latest
      - if: steps.release.outputs.releases_created == 'true'
        run: pnpm install --frozen-lockfile
      # Publishes every package whose version isn't on npm yet.
      - if: steps.release.outputs.releases_created == 'true'
        run: pnpm release
