name: Release

# On main: if there are pending changesets, open/update a "Version Packages" PR.
# When that PR is merged (no changesets left), publish the bumped packages to npm.
on:
  push:
    branches: [main]

permissions:
  contents: write       # push tags, create GitHub releases
  pull-requests: write  # open the Version Packages PR
  id-token: write       # npm trusted publishing (OIDC) + provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
