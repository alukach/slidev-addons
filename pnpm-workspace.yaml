packages:
  - packages/*

# One Slidev version for every addon's demo deck. Reference with "catalog:".
catalog:
  '@slidev/cli': ^53.0.0
  '@slidev/theme-default': ^0.25.0
  vue: ^3.5.0
  esbuild: ^0.28.2   # used by the cssMinify workaround in each vite.config.ts

# Slidev 53 imports markdown-it/lib/token.mjs (via @comark/markdown-it), which
# markdown-it 15 no longer exports. Drop when Slidev fixes it.
overrides:
  markdown-it: ^14.1.0

# Dependencies allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
